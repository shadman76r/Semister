<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="mx-auto container max-w-[360px]">
    <main class="mt-[150px]">
        <h1 class="text-center text-5xl font-bold text-[#0C6BC8] mb-3.5">LOGIN</h1>
        <p class="text-center text-bold mb-[40px] font-bold">BE READY</p>
        <div class="mb-[25px]">
            <i class="fa-solid fa-user"></i><input type="text"  placeholder="Username" class="input input-info" />
        </div>
        <div class="mb-2">
            <i class="fa-solid fa-key"></i><input type="text" placeholder="Password" class="input input-info" /><i class="fa-solid fa-eye-slash"></i>
        </div>
        <span class="text-xl text-[#0C6BC8]"><a href="Forgot.html">Forgot Password?</a></span>

        <button type="button" id="LoginBtn" class="p-5 bg-[#0C6BC8] w-full rounded-2xl text-white text-bold mt-3"><a href="home.html">Login</a></button>

        <p class="text-center mt-2.5">Didn’t Have Account? <span class="text-[#0C6BC8]"><a href="Sign.html" id="singnupBtn">Sign Up</a></span></p>

        <p class="text-center mt-[45px] font-semibold">Others Ways to sing-in</p>
        <img src="../pic/Group 10.png" alt="" class="mx-auto mt-4">
        
    </main>
    <script>
      
        document.getElementById('singnupBtn').addEventListener('click', function() {
            window.location.href = "Sign.html";
            // alert('Redirecting to login page...');
        });
    </script>
</body>
</html>
